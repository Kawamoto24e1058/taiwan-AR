<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f2a33" />
    <title>衣装試着 / 服飾試穿</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" data-lang="ja" aria-pressed="true">日本語</button>
        <button type="button" data-lang="zh-Hant" aria-pressed="false">繁體中文</button>
      </div>
    </header>

    <!-- トップ -->
    <section class="screen" data-screen="top">
      <div class="content">
        <h1 data-i18n="title"></h1>
        <p class="lead" data-i18n="subtitle"></p>
        <p class="warn" id="in-app-warning" hidden data-i18n="inAppWarning"></p>
        <div class="card">
          <h2 data-i18n="noticeTitle"></h2>
          <ul>
            <li data-i18n="notice1"></li>
            <li data-i18n="notice2"></li>
            <li data-i18n="notice3"></li>
          </ul>
          <p class="privacy" data-i18n="privacy"></p>
        </div>
        <button type="button" class="primary big" id="btn-start" data-i18n="start"></button>
      </div>
    </section>

    <!-- 衣装選択 -->
    <section class="screen" data-screen="select" hidden>
      <div class="content">
        <h2 data-i18n="chooseCostume"></h2>
        <ul class="costume-list" id="costume-list"></ul>
        <button type="button" class="ghost" data-go="top" data-i18n="back"></button>
      </div>
    </section>

    <!-- カメラ -->
    <section class="screen camera-screen" data-screen="camera" hidden>
      <div class="stage mirror" id="stage">
        <video id="video" playsinline muted autoplay></video>
        <img id="costume-overlay" alt="" />
        <svg class="guide" id="guide" viewBox="0 0 1080 1620" preserveAspectRatio="none" aria-hidden="true">
          <ellipse id="guide-ellipse" cx="540" cy="520" rx="170" ry="220" />
        </svg>
        <p class="status" id="camera-status" data-i18n="cameraStarting"></p>
      </div>
      <p class="hint" id="camera-hint" data-i18n="alignHint"></p>
      <div class="controls">
        <button type="button" class="ghost" data-go="select" data-i18n="back"></button>
        <button type="button" class="shutter" id="btn-shoot" aria-label="shoot"><span data-i18n="shoot"></span></button>
        <button type="button" class="ghost flip" id="btn-flip" data-i18n="switchCamera"></button>
      </div>
    </section>

    <!-- カメラエラー -->
    <section class="screen" data-screen="camera-error" hidden>
      <div class="content">
        <h2 data-i18n="cameraErrorTitle"></h2>
        <p id="camera-error-message"></p>
        <button type="button" class="primary" id="btn-retry" data-i18n="retry"></button>
        <button type="button" class="ghost" data-go="select" data-i18n="back"></button>
      </div>
    </section>

    <!-- 結果 -->
    <section class="screen" data-screen="result" hidden>
      <div class="content">
        <h2 data-i18n="resultTitle"></h2>
        <img id="result-image" class="result-image" alt="" />
        <p class="small" data-i18n="longPressHint"></p>
        <div class="row">
          <button type="button" class="primary" id="btn-share" data-i18n="share"></button>
          <button type="button" class="primary" id="btn-save" data-i18n="save"></button>
        </div>
        <div class="row">
          <button type="button" class="ghost" id="btn-retake" data-i18n="retake"></button>
          <button type="button" class="ghost" data-go="select" data-i18n="otherCostume"></button>
        </div>
      </div>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
